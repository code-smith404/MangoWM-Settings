name        : mango-settings
version     : 2.2.2
release     : 1
source      :
    - https://github.com/code-smith404/MangoWM-Settings/archive/refs/tags/v2.2.2.tar.gz : b8c3cff9a0c60f727feaa1c622668729d0c0e02b6e1030b94860448d5d5465d6
license     : MIT
component   : desktop
summary     : GTK3 settings manager for the MangoWM Wayland compositor
description : |
    Mango Settings is a GTK 3 configuration tool for the MangoWM Wayland
    compositor. It edits MangoWM's configuration files while preserving
    comments, ordering, symlinks and permissions, with atomic writes and
    timestamped backups.
homepage    : https://github.com/code-smith404/MangoWM-Settings
networking  : true
rundeps     :
    - python
    - python-gobject
    - gtk-3
setup       : |
    make test
install     : |
    make install DESTDIR="$installdir" PREFIX=/usr
