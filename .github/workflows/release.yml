name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions are in sync
        run: sh tests/check-versions.sh
      - name: Release tarball builds
        run: |
          version=$(grep -m1 '^VERSION = ' mango-settings.py | sed 's/VERSION = "\([^"]*\)"/\1/')
          test "v$version" = "${{ github.ref_name }}"

  packages:
    needs: preflight
    uses: ./.github/workflows/packages.yml

  flatpak:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tooling and runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder >/dev/null
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.gnome.Platform//48 org.gnome.Sdk//48
      - name: Use the tag's real checksum in the manifest
        run: packaging/scripts/update-checksums.sh
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --disable-rofiles-fuse --repo=repo \
            --force-clean build-dir \
            packaging/flatpak/io.github.code_smith404.MangoSettings.yml
          flatpak build-bundle repo mango-settings.flatpak \
            io.github.code_smith404.MangoSettings
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-package
          path: mango-settings.flatpak
          if-no-files-found: error

  release:
    needs: [packages, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build source tarball
        run: |
          version=$(grep -m1 '^VERSION = ' mango-settings.py | sed 's/VERSION = "\([^"]*\)"/\1/')
          mkdir -p dist
          git archive --prefix="MangoWM-Settings-$version/" HEAD \
            | gzip -9 > "dist/mango-settings-$version.tar.gz"
          ls -l artifacts dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.apk
            artifacts/*.pkg.tar.zst
            artifacts/*.flatpak
            dist/*.tar.gz

  repositories:
    needs: release
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Install repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils dpkg-dev createrepo-c gnupg >/dev/null
      - name: Import signing key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long
      - name: Build APT and RPM repositories
        run: packaging/scripts/build-repos.sh artifacts public
      - name: Build pacman repository
        run: |
          mkdir -p public/arch/x86_64
          cp -f artifacts/*.pkg.tar.zst public/arch/x86_64/
          cp -f artifacts/mango-settings.db artifacts/mango-settings.files public/arch/x86_64/
          cat > public/arch/mango-settings.conf <<'EOF'
          [mango-settings]
          SigLevel = Optional TrustAll
          Server = https://code-smith404.github.io/MangoWM-Settings/arch/$arch
          EOF
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

  checksums:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh release checksums from the tag archive
        run: |
          packaging/scripts/update-checksums.sh
          if git diff --quiet; then
            echo "Checksums already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packaging/arch/PKGBUILD packaging/alpine/APKBUILD \
              packaging/void/template packaging/solus/package.yml \
              packaging/flatpak/io.github.code_smith404.MangoSettings.yml
            git commit -m "packaging: checksums for ${{ github.ref_name }}"
            git push origin HEAD:main
          fi

  aur:
    needs: [release, checksums]
    runs-on: ubuntu-latest
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish mango-settings to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: mango-settings
          pkgbuild: ./packaging/arch/PKGBUILD
          commit_username: code-smith404
          commit_email: code-smith404@users.noreply.github.com
          ssh_private_key: ${{ env.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
      - name: Publish mango-settings-git to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: mango-settings-git
          pkgbuild: ./packaging/arch/PKGBUILD-git
          commit_username: code-smith404
          commit_email: code-smith404@users.noreply.github.com
          ssh_private_key: ${{ env.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update git snapshot"
